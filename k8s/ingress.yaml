# O API Gateway manda tudo para o NLB do Traefik, e o Traefik escolhe o servico
# pelo prefixo. A API nao conhece /billing: o middleware tira o prefixo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tirar-prefixo
  namespace: garageos-billing
spec:
  stripPrefix:
    prefixes:
      - /billing
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garageos-billing
  namespace: garageos-billing
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: garageos-billing-tirar-prefixo@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: garageos-billing
                port:
                  name: http
