name: CI

# Build e testes a cada PR e a cada push na main. O nome do job ("Build and
# tests") e o check exigido pelo ruleset da main: renomea-lo trava o merge.
#
# Sem filtro de caminho de proposito: um check obrigatorio que nao roda (PR que
# so mexe no README, por exemplo) fica eternamente em "Expected" e trava o PR.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O Sonar usa o historico para saber o que e codigo novo.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Code/GarageOS.Billing.slnx

      - name: Instalar o SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0

      # Precisa envolver o build. O Quality Gate reprova o job, e com ele o PR.
      - name: Iniciar a analise do Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"TechChallengeFase1_garageos-billing-service"
          /o:"techchallengefase1"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/Program.cs"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build Code/GarageOS.Billing.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Code/GarageOS.Billing.UnitTests/GarageOS.Billing.UnitTests.csproj --configuration Release --no-build --settings Code/coverlet.runsettings --results-directory TestResults --logger trx

      # Testcontainers: o runner do GitHub ja tem Docker.
      - name: Integration tests
        run: dotnet test Code/GarageOS.Billing.IntegrationTests/GarageOS.Billing.IntegrationTests.csproj --configuration Release --no-build --settings Code/coverlet.runsettings --results-directory TestResults --logger trx

      - name: Enviar a analise ao Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Junta unitarios, integracao e BDD num relatorio so, por servico.
      - name: Relatorio de cobertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Html;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage/
            TestResults/**/*.trx

      # Trava da meta da fase. Vem depois de publicar, para o relatorio existir mesmo se falhar.
      - name: Exigir 80% de cobertura
        run: |
          TAXA=$(grep -oP 'line-rate="\K[0-9.]+' coverage/Cobertura.xml | head -1)
          echo "Cobertura de linhas: $TAXA"
          awk -v t="$TAXA" 'BEGIN { exit (t + 0 >= 0.8) ? 0 : 1 }'

      - name: Docker build
        run: docker build -t garageos-billing:${{ github.sha }} .
